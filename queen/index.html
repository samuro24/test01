<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#16061f">
  <meta name="color-scheme" content="dark">
  <link rel="stylesheet" href="index.css">
  <script defer src="script.js"></script>
  <title>Rocket Queen</title>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <a class="back-link" href="../" aria-label="Вернуться в меню">Menu</a>
      <span class="local-badge"><i></i> Local mode</span>
    </header>

    <section class="signal-card" aria-labelledby="app-title">
      <div class="signal-card__glow"></div>
      <div class="signal-stage" id="signal-stage">
        <span class="orbit orbit--outer"></span>
        <span class="orbit orbit--inner"></span>
        <span class="spark spark--one"></span>
        <span class="spark spark--two"></span>
        <div class="signal-value" id="signal-value" aria-live="polite">--</div>
        <div class="signal-label">коэффициент</div>
      </div>

      <img class="brand-logo" src="images/Lucky.webp" alt="Rocket Queen">
      <h1 id="app-title">Signal generator</h1>
      <p class="description">Локальный генератор случайного коэффициента</p>

      <button class="generate-button" id="generate-button" type="button">
        <span class="generate-button__label">Сгенерировать</span>
        <span class="generate-button__flare"></span>
      </button>

      <div class="status" id="status" aria-live="polite">Готов к запуску</div>
      <div class="history" id="history" aria-label="Последние результаты"></div>
    </section>

    <p class="disclaimer">Результат формируется случайно на этом устройстве и не является прогнозом.</p>
  </main>
</body>
</html>
